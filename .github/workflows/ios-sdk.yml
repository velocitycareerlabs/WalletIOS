name: WalletIOS-SDK-Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Configuration environment
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - rc
          - prod
      rc_number:
        description: Positive RC counter used only when environment is rc, for example 1 publishes 2.10.0-rc.1
        required: false
        type: string
env:
  GLOBAL_ENV: ${{ github.event_name == 'push' && format('{0}', 'dev') || inputs.environment }}

jobs:
  tests-ios-sdk:
    runs-on: macos-15
    env:
      XC_VERSION: "26.4"
    steps:
      # Git clone repository
      - name: Git clone repository
        uses: actions/checkout@v4
      # Select latest Xcode
      - name: Select latest Xcode
        run: "sudo xcode-select -s /Applications/Xcode_${{ env.XC_VERSION }}.app || sudo xcode-select -s /Applications/Xcode_16.4.app"
      - name: Prepare iOS simulator
        shell: bash
        run: |
          read -r runtime device_type < <(
            ruby -rjson -e 'sdk = Gem::Version.new(IO.popen(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], &:read).strip); runtime = JSON.parse(IO.popen(["xcrun", "simctl", "list", "runtimes", "-j"], &:read))["runtimes"].select { |r| r["isAvailable"] && r["identifier"].include?("iOS") && Gem::Version.new(r["version"]) <= sdk }.max_by { |r| Gem::Version.new(r["version"]) }; device = runtime&.dig("supportedDeviceTypes")&.find { |d| d["productFamily"] == "iPhone" }; puts [runtime&.dig("identifier"), device&.dig("identifier")].compact.join(" ")'
          )

          if [ -z "$device_type" ] || [ -z "$runtime" ]; then
            echo "Unable to find an available iPhone simulator device type and iOS runtime."
            xcrun simctl list devicetypes
            xcrun simctl list runtimes
            exit 1
          fi

          simulator_udid=$(xcrun simctl create "WalletIOS CI" "$device_type" "$runtime")
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Run tests
        run: xcodebuild test -project VCL.xcodeproj -scheme VCL -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_UDID}"
        working-directory: VCL

  set-environment:
    runs-on: ubuntu-latest
    steps:
      - id: environment
        name: Set Environment
        run: |
          echo "GLOBAL_ENV=${{ env.GLOBAL_ENV }}" >> "$GITHUB_OUTPUT"
        env:
          SCHEME: ${{ env.GLOBAL_ENV }}
    outputs:
      GLOBAL_ENV: ${{ steps.environment.outputs.GLOBAL_ENV }}

  build-and-publish-ios-sdk:
    if: needs.set-environment.outputs.GLOBAL_ENV == 'prod' || needs.set-environment.outputs.GLOBAL_ENV == 'rc'
    needs:
      - tests-ios-sdk
      - set-environment
    runs-on: macos-15
    env:
      XC_VERSION: "26.4"
      # Recomends to use separated PAT token to access to another repos
      PAT_TOKEN: ${{ secrets.VCL_RW_ACCESS_TOKEN }}
      GLOBAL_ENV: ${{ needs.set-environment.outputs.GLOBAL_ENV }}
    steps:
      # Git clone repository
      - name: Git clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.PAT_TOKEN }}
      # Select latest Xcode
      - name: Select latest Xcode
        run: "sudo xcode-select -s /Applications/Xcode_${{ env.XC_VERSION }}.app || sudo xcode-select -s /Applications/Xcode_16.4.app"
      # Extract branch name
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//_/g')" >> "$GITHUB_ENV"
      # Get Version
      - name: Get Version
        shell: bash
        run: |
          set -euo pipefail

          base_versions=$(
            xcodebuild -project VCL.xcodeproj -scheme VCL -configuration Release -destination generic/platform=iOS -showBuildSettings |
              awk '/^[[:space:]]*MARKETING_VERSION = / {
                gsub(/[[:space:]]/, "", $3)
                print $3
              }' |
              sort -u
          )
          base_version_count=$(printf '%s\n' "$base_versions" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$base_version_count" != "1" ]; then
            echo "Expected exactly one SDK MARKETING_VERSION for io.velocitycareerlabs.VCL, found: ${base_versions}"
            exit 1
          fi

          base_framework_version=$(printf '%s\n' "$base_versions" | sed '/^$/d')
          if [[ ! "$base_framework_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SDK MARKETING_VERSION must be a semver base version like 2.10.0. Found: ${base_framework_version}"
            exit 1
          fi

          if [ "$GLOBAL_ENV" = "rc" ]; then
            if ! [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "RC publishes require workflow input rc_number as a positive integer."
              exit 1
            fi
            framework_version="${base_framework_version}-rc.${RC_NUMBER}"
          else
            framework_version="$base_framework_version"
          fi

          {
            echo "BASE_FRAMEWORK_VERSION=${base_framework_version}"
            echo "FRAMEWORK_VERSION=${framework_version}"
            echo "RELEASE_VERSION=v${framework_version}"
            echo "RELEASE_NOTES_FILE=${GITHUB_WORKSPACE}/.github/releases/v${base_framework_version}.md"
          } >> "$GITHUB_ENV"
        working-directory: VCL
        env:
          RC_NUMBER: ${{ inputs.rc_number }}
      - name: Validate prod release context
        if: env.GLOBAL_ENV == 'prod'
        shell: bash
        run: |
          set -euo pipefail

          major_minor=$(printf '%s' "${BASE_FRAMEWORK_VERSION}" | cut -d. -f1,2)
          patch_version=$(printf '%s' "${BASE_FRAMEWORK_VERSION}" | cut -d. -f3)
          expected_release_branch="release/v${major_minor}"

          if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "${expected_release_branch}" ]; then
            echo "Prod builds for ${BASE_FRAMEWORK_VERSION} may only run from main or ${expected_release_branch}."
            exit 1
          fi

          if [ "$patch_version" != "0" ] && [ "${GITHUB_REF_NAME}" != "${expected_release_branch}" ]; then
            echo "Patch release ${BASE_FRAMEWORK_VERSION} must run from ${expected_release_branch}."
            exit 1
          fi
      # VCL build
      - name: VCL build
        run: scripts/build_xcframework.sh
        working-directory: VCL
      # Git Set Identity
      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      # Clone Additional repos
      - name: Clone Additional repos
        run: |
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Specs.git"
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository_owner }}/VCL-Swift.git"
      - name: Validate publish version is new
        shell: bash
        run: |
          set -euo pipefail

          check_remote_tag_absent() {
            local repo_dir="$1"
            local tag_name="$2"
            local label="$3"
            local output
            local status

            set +e
            output=$(git -C "$repo_dir" ls-remote --exit-code --tags origin "refs/tags/${tag_name}" 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "${label} tag ${tag_name} already exists."
              exit 1
            fi

            if [ "$status" -eq 2 ]; then
              return 0
            fi

            echo "Unable to check ${label} tag ${tag_name}:"
            echo "$output"
            exit "$status"
          }

          if [ -d "Specs/VCL/${FRAMEWORK_VERSION}" ]; then
            echo "Specs already contains VCL/${FRAMEWORK_VERSION}; publish step will verify it matches the generated podspec."
          fi

          check_remote_tag_absent VCL-Swift "${FRAMEWORK_VERSION}" "VCL-Swift"
          check_remote_tag_absent . "${RELEASE_VERSION}" "WalletIOS"
      # Publish to Specs
      - name: Publish to Specs
        run: |
          set -euo pipefail

          generated_spec_dir=$(mktemp -d)
          trap 'rm -rf "${generated_spec_dir}"' EXIT

          cp -r VCL/0.6.0 "${generated_spec_dir}/${FRAMEWORK_VERSION}"
          sed -i '' "s/0\.6\.0/${FRAMEWORK_VERSION}/g" "${generated_spec_dir}/${FRAMEWORK_VERSION}/VCL.podspec"

          if [ -d "VCL/${FRAMEWORK_VERSION}" ]; then
            if diff -qr "VCL/${FRAMEWORK_VERSION}" "${generated_spec_dir}/${FRAMEWORK_VERSION}" >/dev/null; then
              echo "Specs already contains matching VCL/${FRAMEWORK_VERSION}; skipping Specs commit."
              exit 0
            fi

            echo "Specs already contains VCL/${FRAMEWORK_VERSION}, but it differs from the generated podspec."
            diff -ru "VCL/${FRAMEWORK_VERSION}" "${generated_spec_dir}/${FRAMEWORK_VERSION}" || true
            exit 1
          fi

          mv "${generated_spec_dir}/${FRAMEWORK_VERSION}" "VCL/${FRAMEWORK_VERSION}"
          git add "VCL/${FRAMEWORK_VERSION}"
          git commit -m "sdk ${FRAMEWORK_VERSION}"
          git push
        env:
          GITHUB_TOKEN: ${{ env.PAT_TOKEN }}
        working-directory: Specs
      # Publish to VCL-Swift
      - name: Publish to VCL-Swift
        run: |
           set -euo pipefail

           cp -r ../VCL/build/VCL.xcframework Frameworks/
           git add Frameworks/
           if git diff --cached --quiet; then
            echo "VCL-Swift Frameworks already match ${FRAMEWORK_VERSION}; tagging current HEAD."
           else
            git commit -m "sdk ${FRAMEWORK_VERSION}"
            git push
           fi
           git tag "${FRAMEWORK_VERSION}"
           git push origin "${FRAMEWORK_VERSION}"

           if [ "${GLOBAL_ENV}" = "prod" ]; then
            echo "${PAT_TOKEN}" | gh auth login --with-token
            gh release create "${FRAMEWORK_VERSION}" --title "VCL-${FRAMEWORK_VERSION}" --latest
           fi
        working-directory: VCL-Swift
      - name: Tag and release WalletIOS source
        shell: bash
        run: |
          set -euo pipefail

          git tag "${RELEASE_VERSION}" "${GITHUB_SHA}"
          git push origin "${RELEASE_VERSION}"

          if [ "${GLOBAL_ENV}" = "prod" ]; then
            echo "${PAT_TOKEN}" | gh auth login --with-token
            gh release create "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_VERSION}" \
              --notes-file "${RELEASE_NOTES_FILE}" \
              --latest
          fi
